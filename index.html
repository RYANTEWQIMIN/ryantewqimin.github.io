<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Come on in. Welcome to Ryan’s Personal Museum — a little place to get to know Ryan.">
  <meta name="theme-color" content="#234ce9">
  <title>Ryan’s Personal Museum</title>
  <link rel="icon" type="image/png" href="/favicon-ryan-7318a8cf01.png" sizes="128x128">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    :root{--blue:#234ce9;--ink:#1a2440;--muted:#606779;--yellow:#ffdf55;--paper:#f2f5fc;--line:#e1e5ee;font-family:'DM Sans',sans-serif;color:var(--ink);background:#fff;color-scheme:light}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:2rem}body{margin:0;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.65}a,button,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:6px}.skip{position:fixed;top:-10rem;left:1rem;z-index:5;background:#fff;padding:1rem}.skip:focus{top:1rem}[hidden]{display:none!important}
    .container{width:min(1240px,calc(100% - 112px));margin-inline:auto}.header{height:112px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:43px;height:49px;display:grid;place-items:center;border:2px solid var(--blue);border-radius:22px 22px 4px 4px;font:italic bold 32px Georgia,serif;color:var(--blue)}.brand-name{display:block;font:italic 25px Georgia,serif;line-height:1.2}.brand-sub{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;line-height:1.5}.nav{display:flex;align-items:center;gap:32px;font-size:14px}.nav a{padding:10px 0}.nav a:hover{color:var(--blue)}.nav .active{color:var(--blue);border-bottom:1px solid var(--blue)}.nav-note{font:italic 17px Georgia,serif;padding-left:26px;border-left:1px solid var(--line);color:var(--muted)}
    .hero{min-height:690px;display:grid;grid-template-columns:1.17fr 1fr;align-items:center;gap:38px;padding-block:74px 82px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--blue);display:flex;align-items:center;gap:12px;margin:0 0 24px}.eyebrow:before{content:'';height:1px;width:27px;background:currentColor}.hero h1{font-family:Manrope,sans-serif;font-size:clamp(4rem,6.5vw,6.1rem);font-weight:800;letter-spacing:-.065em;line-height:1.08;margin:0}.hero h1 span{display:block}.hero h1 .accent{color:var(--blue)}.welcome{font-size:20px;line-height:1.65;color:var(--muted);max-width:490px;margin:27px 0 29px}.welcome strong{font-weight:500;color:var(--ink)}.journey-button{display:inline-flex;align-items:center;justify-content:center;padding:18px 28px;min-height:58px;border-radius:7px;color:#fff;background:var(--blue);font-weight:600;box-shadow:0 4px 0 #1734ac;transition:transform .2s,box-shadow .2s,background .2s}.journey-button:hover{background:#163ac7;transform:translateY(-2px);box-shadow:0 6px 0 #1734ac}.little-note{margin:18px 0 0;font-size:13px;color:var(--muted)}
    .little-note.hero-email{margin-top:8px;font-size:14px;line-height:1.6}
    .portrait-area{position:relative;isolation:isolate;margin:4px 16px 0 21px;padding:20px 16px 22px}.portrait-area:before{content:'';position:absolute;inset:50px 1px 5px 30px;z-index:-1;background:var(--yellow);border-radius:6px;transform:rotate(5deg)}.portrait-frame{background:#fff;padding:16px 16px 0;border:1px solid var(--line);box-shadow:0 15px 40px #23396812;transform:rotate(-4deg);border-radius:3px}.portrait-image{height:390px;position:relative;background:var(--paper);overflow:hidden;border-radius:1px}.portrait-image img[hidden],.placeholder[hidden]{display:none}.portrait-image img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.placeholder-letter{font:italic 104px Georgia,serif;line-height:1;color:var(--blue);margin-bottom:21px;letter-spacing:-.07em}.placeholder p{font:italic 30px/1.2 Georgia,serif;color:var(--blue);margin:0}.caption{min-height:73px;display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--ink);font-size:12px;letter-spacing:.08em}.caption-name{font-size:22px;line-height:1;letter-spacing:0}.caption span:last-child{font:italic 20px Georgia,serif;letter-spacing:0;color:var(--blue)}.portrait-tag{position:absolute;right:-8px;top:0;z-index:2;background:var(--yellow);border:1px solid #ebc234;padding:11px 17px;font-size:12px;line-height:1.5;font-weight:700;letter-spacing:.08em;transform:rotate(6deg);box-shadow:0 3px 10px #1a24400a}
    .entrance-strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:23px 0;font-size:12px;letter-spacing:.075em;font-weight:500}.entrance-strip .museum-note{font:italic 18px Georgia,serif;letter-spacing:0;color:var(--muted)}.ticket{display:flex;align-items:center;gap:12px}.ticket-icon{font-size:22px;color:var(--blue)}
    .about{padding-block:105px 110px;display:grid;grid-template-columns:.65fr 1fr;gap:65px;align-items:start}.section-number{font:italic 52px Georgia,serif;letter-spacing:-.08em;color:var(--blue);margin:0 0 20px}.about h2{font-family:Manrope,sans-serif;font-size:42px;line-height:1.2;letter-spacing:-.045em;margin:0}.about-copy{padding-top:12px}.about-lead{font:32px/1.45 Georgia,serif;margin:0 0 19px;max-width:640px}.about-copy>p:not(.about-lead){font-size:18px;line-height:1.75;color:var(--muted);margin:0;max-width:610px}.education{display:flex;align-items:center;gap:14px;margin-top:28px;font-size:14px;color:var(--blue)}.education svg{width:26px;height:26px;flex-shrink:0}.education strong{display:block;font-weight:600;line-height:1.6}.education span{font-size:13px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:28px 0 31px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.footer a:hover{color:var(--blue)}
    .entrance-footer{justify-content:center;text-align:center}
    @media(min-width:1550px){.hero{min-height:calc(100svh - 183px)}}
    @media(max-width:1050px){.container{width:calc(100% - 64px)}.hero{gap:25px;min-height:640px}.hero h1{font-size:clamp(3.8rem,7.4vw,5rem)}.portrait-area{margin:0;padding:16px 8px 16px}.portrait-image{height:350px}.portrait-frame{padding:12px 12px 0}.welcome{font-size:18px}.nav-note{display:none}.about{gap:40px}.about-lead{font-size:28px}}
    @media(max-width:740px){.container{width:calc(100% - 40px)}.header{height:89px}.brand-mark{width:35px;height:40px;font-size:26px}.brand-name{font-size:23px}.brand-sub{font-size:10px}.nav{gap:18px;font-size:13px}.hero{grid-template-columns:1fr;padding:45px 0 50px;gap:38px}.eyebrow{margin-bottom:20px;font-size:11px}.hero h1{font-size:clamp(3.8rem,11vw,5.5rem);letter-spacing:-.065em;line-height:1.05}.welcome{font-size:18px;max-width:450px;margin:23px 0 25px}.portrait-area{width:min(380px,calc(100% - 24px));justify-self:center;margin:0 0 0 -5px;padding:18px 7px 16px}.portrait-image{height:345px}.portrait-tag{right:-12px;font-size:11px}.caption{min-height:65px}.entrance-strip{font-size:10px;gap:8px;padding:20px 0}.entrance-strip .museum-note{font-size:15px}.entrance-strip .edition{display:none}.about{grid-template-columns:1fr;padding:64px 0 65px;gap:23px}.section-number{font-size:40px;margin-bottom:13px}.about h2{font-size:35px}.about-copy{padding-top:0}.about-lead{font-size:26px}.about-copy>p:not(.about-lead){font-size:17px}.footer{gap:16px;font-size:12px;padding:24px 0}.little-note{font-size:12px}}
    @media(max-width:370px){.nav{gap:12px}.nav .active{display:none}.hero h1{font-size:3.5rem}.entrance-strip .museum-note{font-size:13px}.footer{flex-wrap:wrap}.portrait-image{height:310px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
    .header{height:128px}.header .nav{align-self:flex-end;margin-bottom:16px}.brand-logo{display:block;width:200px;max-width:100%;height:auto}
    @media(max-width:740px){.header{height:108px}.brand-logo{width:160px}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="container">
    <header class="header">
      <a class="brand" href="#" aria-label="Ryan’s Personal Museum, home"><img class="brand-logo" src="/assets/ryan-full-logo-3eee0b24a0.png" alt="Ryan’s Personal Museum" width="811" height="427"></a>
      <div class="nav"><span class="nav-note">A little world of my own.</span></div>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="greeting">
        <div class="hero-copy">
          <p class="eyebrow">A PERSONAL MUSEUM. A WARM WELCOME.</p>
          <h1 id="greeting"><span>Hey,</span><span>Good to see</span><span class="accent">you here!</span></h1>
          <p class="welcome">Welcome to <strong>Ryan’s Personal Museum</strong></p>
          <a class="journey-button" href="/journey">Start the journey!</a>
          <p class="little-note">No tickets needed. Just a little curiosity.</p>
          <p class="little-note hero-email">📩 Email: tewryan05@gmail.com</p>
        </div>
        <div class="portrait-area">
          <span class="portrait-tag">A LITTLE BIT<br>OF RYAN</span>
          <figure class="portrait-frame" style="margin:0">
            <div class="portrait-image">
              <img id="portrait" alt="Ryan’s portrait" hidden>
              <div class="placeholder" id="photo-placeholder"><div><div class="placeholder-letter" aria-hidden="true">R.</div><p>The face behind<br>the museum.</p></div></div>
            </div>
            <figcaption class="caption"><span class="caption-name" role="img" aria-label="Maple leaf">🍁</span><span>Nice to meet you!</span></figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer class="footer entrance-footer"><span>© <span id="year">2026</span> Ryan’s Personal Museum</span></footer>
  </div>
  <script>
    const photo=document.querySelector('#portrait');
    const placeholder=document.querySelector('#photo-placeholder');
    document.querySelector('#year').textContent=new Date().getFullYear();
    function showPhoto(url){photo.onload=()=>{photo.hidden=false;placeholder.hidden=true;};photo.onerror=()=>{photo.hidden=true;placeholder.hidden=false;};photo.src=url;}
    showPhoto('/assets/ryan-portrait-beacbb36dcc5.jpg');
  </script>
</body>
</html>
